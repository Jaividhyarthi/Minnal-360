kind = "web"
previewPath = "/"
title = "GridPulse AI"
description = "A dark control-room dashboard for monitoring and orchestrating a simulated smart grid with autonomous energy agents, live digital-twin flows, explainable decisions, analytics, and disruption recovery scenarios."
version = "1.0.0"
id = "artifacts/gridpulse-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21576

[services.development]
run = "pnpm --filter @workspace/gridpulse-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gridpulse-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/gridpulse-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21576"
BASE_PATH = "/"
